name: Update Windows runner metadata

on:
  schedule:
    - cron: "17 2 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metadata-runner-windows
  cancel-in-progress: false

jobs:
  collect:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-2022
          - windows-2025
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Collect installed software
        shell: pwsh
        run: ./scripts/collect-runner-windows.ps1 -Output "out/${{ matrix.runner }}.json" -RunnerLabel "${{ matrix.runner }}" -Strict
      - uses: actions/upload-artifact@v6
        with:
          name: runner-windows-${{ matrix.runner }}
          path: out/${{ matrix.runner }}.json
          retention-days: 1

  publish:
    needs: collect
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          pattern: runner-windows-*
          path: out
          merge-multiple: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Merge and validate
        run: |
          node scripts/merge-runner-environments.mjs --platform windows --input out --output public/metadata/environments/v1/github-actions
          npm run metadata:schemas
          npm run metadata:platform:verify
      - name: Commit current snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/metadata/environments/v1/github-actions
          git diff --cached --quiet && exit 0
          git commit -m "data: update Windows runner metadata"
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          exit 1
